[package]
name = "beacon-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[lib]
name = "beacon"

# Its own workspace, so that no parent directory can claim it.
[workspace]

[dependencies]
flate2 = "1"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
tempfile = "3"
