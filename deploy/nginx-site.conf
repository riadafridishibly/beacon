# Replace telemetry.example.com, then install in the server's nginx sites.

server {
    listen 80;
    listen [::]:80;
    server_name telemetry.example.com;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "http2 on" needs nginx 1.25, newer than Ubuntu 24.04 ships.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name telemetry.example.com;

    ssl_certificate /etc/letsencrypt/live/telemetry.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telemetry.example.com/privkey.pem;

    # Client addresses must not be stored, and both logs record them.
    access_log off;
    error_log /dev/null;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Above ingest's 1 MiB limit, so the app answers oversize batches itself.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8178;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The dashboard's cross-origin check compares Origin against Host.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Ingest reports a body read failure as invalid JSON, which makes
        # clients drop the batch. Buffering keeps slow uploads from causing it.
        proxy_request_buffering on;
    }
}
